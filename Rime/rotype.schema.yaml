# Rime schema
# encoding: utf-8

schema:
  schema_id: rotype
  name: RoType 双向双语
  version: "0.3.0"
  author:
    - RoType contributors
  description: >-
    中文拼音、英文原词及异步本地双向翻译作为独立候选。
  dependencies:
    - rotype_en

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: simplification
    reset: 1
    # 强制启用繁转简，不提供菜单开关。
  - name: full_shape
    reset: 0
    states: [半角, 全角]

menu:
  page_size: 9

engine:
  processors:
    - ascii_composer
    - recognizer
    - lua_processor@*rotype_dynamic_refresh
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@english
    - lua_translator@*rotype_english_echo
    - lua_translator@*rotype_bilingual_translator
  filters:
    - lua_filter@*rotype_dynamic_bilingual_filter
    - simplifier@simplification
    - lua_filter@*rotype_simplified_only_filter
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 常用模糊音：覆盖最常见的声母、前后鼻音混淆，不扩大到方言级规则。
    - derive/^([zcs])h/$1/
    - derive/^([zcs])([^h])/$1h$2/
    - derive/^n/l/
    - derive/^l/n/
    - derive/([ei])n$/$1ng/
    - derive/([ei])ng$/$1n/
    # 简拼与常见拼写、按键纠错，规则取自鼠须管自带 pinyin.yaml。
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/correction
    - derive/^([jqxy])u/$1v/correction
    - derive/un$/uen/correction
    - derive/ui$/uei/correction
    - derive/iu$/iou/correction
    - derive/([aeiou])ng$/$1gn/correction
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/correction
    - derive/ong$/on/correction
    - derive/ao$/oa/correction
    - derive/([iu])a(o|ng?)$/a$1$2/correction
    - erase/^xx$/

translator:
  dictionary: rotype_zh
  contextual_suggestions: true
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  initial_quality: 1.2
  max_homographs: 7
  max_homophones: 7

grammar:
  language: zh-hant-t-essay-bgw
  collocation_max_length: 5
  collocation_min_length: 2

english:
  dictionary: rotype_en
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
  initial_quality: 1.2
  comment_format:
    - xform/.+/〔EN〕/

simplification:
  option_name: simplification
  opencc_config: tw2s.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
