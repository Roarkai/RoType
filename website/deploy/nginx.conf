# Standalone vhost. Do not replace nginx.conf or another site's configuration.
server {
    listen 80;
    listen [::]:80;
    server_name type.roarkist.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rotype-acme;
        default_type text/plain;
    }
    location / { return 301 https://type.roarkist.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name type.roarkist.com;
    ssl_certificate /etc/letsencrypt/live/type.roarkist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/type.roarkist.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/rotype/current;
    index index.html;
    charset utf-8;
    autoindex off;
    access_log /var/log/nginx/rotype.access.log;
    error_log /var/log/nginx/rotype.error.log;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Cloudflare documents no-transform as the opt-out for automatic analytics injection.
    add_header Cache-Control "public, no-transform" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain application/xml;
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }
    location ~ \.(css|js)$ {
        expires 5m;
        try_files $uri =404;
    }
    location /downloads/ {
        types { application/octet-stream pkg gz; text/plain sha256; }
        default_type application/octet-stream;
        expires 365d;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location /deploy/ { return 404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
